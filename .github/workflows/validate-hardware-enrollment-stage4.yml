name: Validate Hardware Enrollment Stage 4

on:
  push:
    branches:
      - feat/hardware-hub-secure-enrollment-stage4

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asihjaya_ci
          POSTGRES_DB: asihjaya_rms_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asihjaya_ci -d asihjaya_rms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: true
      - name: Prepare disposable test environment
        shell: bash
        run: |
          echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_NAME=Asihjaya Retail Management System" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "INTERNAL_RENDER_ORIGIN=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "DEFAULT_ORGANIZATION_SLUG=asihjaya" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://asihjaya_ci@127.0.0.1:5432/asihjaya_rms_ci" >> "$GITHUB_ENV"
          TEST_VALUE="ci-$(printf 'x%.0s' {1..80})"
          for NAME in SESSION_SECRET RECEIPT_VERIFICATION_SECRET CUSTOMER_HISTORY_SESSION_SECRET CUSTOMER_HISTORY_PIN_PEPPER SECURITY_RATE_LIMIT_SECRET PDF_RENDER_TOKEN_SECRET HARDWARE_AGENT_CREDENTIAL_ENCRYPTION_KEY; do
            echo "$NAME=$TEST_VALUE-$NAME" >> "$GITHUB_ENV"
          done
          echo "IMAGE_STORAGE_DRIVER=local" >> "$GITHUB_ENV"
          echo "IMAGE_STORAGE_ROOT=.data/ci-uploads" >> "$GITHUB_ENV"
          echo "SERVER_ACTION_BODY_SIZE_LIMIT=20mb" >> "$GITHUB_ENV"
          echo "TRUST_PROXY=false" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Hardware application contracts
        run: npm run check:hardware-app
      - name: TypeScript
        run: npm run typecheck
      - name: Route registry diagnostic
        continue-on-error: true
        run: npm run routes:check
      - name: Push current schema to disposable PostgreSQL
        run: npx drizzle-kit push --force
      - name: Enrollment claim and completion database integration
        run: npx tsx scripts/run-hardware-enrollment-claim-integration.ts
      - name: Hardware Hub JavaScript syntax
        run: |
          node --check hardware-hub/lib/credential-store.js
          node --check hardware-hub/lib/installer-enrollment.js
          node --check hardware-hub/lib/enrollment-client.js
          node --check hardware-hub/scripts/start-agent-secure.js
          node --check hardware-hub/scripts/check-config.js
          node --check hardware-hub/scripts/enroll-installer.js
      - name: Hardware Hub dependencies
        run: npm --prefix hardware-hub ci
      - name: Hardware Hub CI
        run: npm --prefix hardware-hub run check:ci
