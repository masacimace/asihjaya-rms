name: Build Hardware Hub Installer

on:
  push:
    branches:
      - feat/hardware-hub-native-installer-stage5
      - feat/hardware-hub-polishing-regression-stage6
    paths:
      - "hardware-hub/**"
      - ".github/workflows/build-hardware-hub-installer.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "RMS HTTPS URL embedded into Setup.exe"
        required: true
        default: "https://ajsystem.id"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: hardware-hub/package-lock.json

      - name: Install Hardware Hub dependencies
        run: npm ci --prefix hardware-hub --omit=dev

      - name: Validate installer regression contracts
        run: |
          npm --prefix hardware-hub run check:installer
          npm --prefix hardware-hub run check:stage6

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          $compiler = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup 7 ISCC.exe not found after installation." }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $apiUrl = "${{ github.event.inputs.api_url }}"
          if (-not $apiUrl) { $apiUrl = "https://ajsystem.id" }
          & hardware-hub/installer/build-installer.ps1 -ApiUrl $apiUrl -InnoCompiler $env:INNO_COMPILER -SkipNpmInstall

      - name: Record installer checksum
        shell: pwsh
        run: |
          $setup = "hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "SHA256=$hash" | Set-Content "hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.sha256.txt" -Encoding ascii
          Write-Host "Setup SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: asihjaya-hardware-hub-setup
          path: |
            hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.exe
            hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.sha256.txt
          if-no-files-found: error
          retention-days: 14

  build-local-uat:
    if: github.event_name == 'push' && github.ref_name == 'feat/hardware-hub-polishing-regression-stage6'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: hardware-hub/package-lock.json

      - name: Install Hardware Hub dependencies
        run: npm ci --prefix hardware-hub --omit=dev

      - name: Validate installer regression contracts
        run: |
          npm --prefix hardware-hub run check:installer
          npm --prefix hardware-hub run check:stage6

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          $compiler = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup 7 ISCC.exe not found after installation." }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build localhost UAT Setup.exe
        shell: pwsh
        run: |
          & hardware-hub/installer/build-installer.ps1 -ApiUrl "http://127.0.0.1:3000" -InnoCompiler $env:INNO_COMPILER -SkipNpmInstall

      - name: Record localhost UAT installer checksum
        shell: pwsh
        run: |
          $setup = "hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "SHA256=$hash" | Set-Content "hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.sha256.txt" -Encoding ascii
          Write-Host "Local UAT Setup SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: asihjaya-hardware-hub-setup-local-uat
          path: |
            hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.exe
            hardware-hub/installer/output/ASIHJAYA-Hardware-Hub-Setup.sha256.txt
          if-no-files-found: error
          retention-days: 14
